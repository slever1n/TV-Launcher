plugins {
    id 'com.android.application'
}

android {
    namespace 'com.custom.tvlauncher'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('../../.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.custom.tvlauncher"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "11.0"

        // TMDB key lives in git-ignored launcher/local.properties:  tmdb.apiKey=<v3 key or v4 read token>
        def localProps = new Properties()
        def localFile = rootProject.file('local.properties')
        if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
        buildConfigField "String", "TMDB_API_KEY", "\"${localProps.getProperty('tmdb.apiKey', '')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Platform widgets keep the launcher small and fast on low-memory televisions.
